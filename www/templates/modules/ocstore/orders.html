<html>
    <head>
    </head>
    <body>
        <div class="row">
            <div class="col-12 col-xl-10    ">

                <h3>Імпорт замовлень</h3>
                
                <div class="navbar    ">
                    <form zippy="mform"  >
                       <div class="row  ">

                        <label class="col-form-label col-auto" for="mlist">Магазин </label>
                         <div class="col-auto  ">
                        <select class="form-control me-2" zippy="mlist">
                            
                        </select>
                        </div>
                         <div class="col-auto  ">
                        <input onclick="document.getElementById('dialogwait').showModal()" type="submit" class=" me-2 btn btn-success  "
                               value="З`єднати">

                       </div> </div>
                    </form>
                </div>

                <div class="navbar    ">
                    <form zippy="filter"  >
                       <div class="row  ">

                        <label class="col-form-label col-auto" for="status">Статус в магазині </label>
                         <div class="col-auto  ">
                        <select class="form-control me-2" zippy="status">
                            <option value="0">Не обрано</option>
                        </select>
                        </div>
                         <div class="col-auto  ">
                        <input onclick="document.getElementById('dialogwait').showModal()" type="submit" class=" me-2 btn btn-success  "
                               value="Завантажити">

                       </div> </div>
                    </form>
                </div>
               <form zippy="filter2"  >

                <table class="table   table-sm   ">
                    <tr>

                        <th style="width:30px"><input type="checkbox" id="chall" onchange="chclick()"></th>

                        <th>Номер</th>
                        <th>Дата</th>

                        <th>Клієнт</th>
                        <th class="text-end">Сума</th>
                        <th> Коментар</th>


                    </tr>
                    <tr zippy="neworderslist">
                        <td><input type="checkbox" zippy="ch" class="chc"></td>
                        

                        <td zippy="number"></td>
                        <td class="text-nowrap" zippy="date"></td>

                        <td zippy="customer"></td>
                        <td zippy="amount" class="text-end"></td>
                        <td zippy="comment"></td>


                    </tr>

                </table>                
                <div class="navbar    ">
                      

                        <div class="   ">
                    
                       
                        <input type="submit" class=" me-2 btn btn-success  "
                               value="Імпортувати">
                      
                    </div>
                    

                </div>
                </form>
            </div>
            <div class="col-12 col-xl-10       ">

                <h3>Експорт статусів в магазин</h3>
                <div class="navbar nav justify-content-start">
                    <a onclick="document.getElementById('dialogwait').showModal()" zippy="refreshbtn" class="  btn btn-success  ">Оновити</a>

                </div>
                <form zippy="updateform">
                    <table class="table   table-sm   ">
                        <tr>
                            <th style="width:30px"><input type="checkbox" id="chall" onchange="chclick()"></th>
                            <th>Номер</th>
                            <th>OC Номер</th>
                            <th>Дата</th>

                            <th>Клієнт</th>
                            <th class="text-end">Сума</th>
                            <th>Статус</th>


                        </tr>
                        <tr zippy="orderslist">
                            <td><input type="checkbox" zippy="ch" class="chc"></td>
                            <td zippy="number2"></td>
                            <td zippy="number3"></td>
                            <td class="text-nowrap" zippy="date2"></td>

                            <td zippy="customer2"></td>
                            <td zippy="amount2" class="text-end"></td>
                            <td zippy="state"></td>


                        </tr>

                    </table>


                    <div class="ms-2   row  ">
                        <label  class="col-form-label col-auto" for="estatus">Статус в магазині </label>
                          <div class="col-auto  ">
                        <select class=" form-control me-2" zippy="estatus">
                            <option value="0">Не обрано</option>
                        </select>   
                        </div>
                         <div class="col-auto  ">
                        <input onclick="document.getElementById('dialogwait').showModal()" type="submit" class="  btn btn-success  "
                               value="Відправити">

                    </div>
                    </div>
                </form>

            </div>
        </div>

        <script>
            function chclick() {
                var ch = $("#chall").prop('checked');
                $('.chc').prop('checked', ch)
            }

        </script>
    </body>
</html>
