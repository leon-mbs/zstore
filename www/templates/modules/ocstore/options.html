<html>

    <body>
           <div class="row" zippy="listpan" >
            <div class="col-12    col-md-10    col-xl-8  col-xxl-6  ">
                  <a zippy="addnew" class="btn btn-success">Додати новий</a> 
                  <table class="table   table-sm   ">
         
                    <tr zippy="list">


                        <td zippy="rsite"></td>
                        <td zippy="rsalesourcname"></td>
                        <td > <a zippy="rtest">Тест </a> </td>
                        <td > <a zippy="redit"><i class="fa fa-edit"></i> </a> </td>
                        <td > <a zippy="rdel"><i class="fa fa-trash"></i> </a> </td>
                         
                        
                    </tr>

                </table> 
             </div> 
           </div> 
        <div class="row  ">
            <div class="col-12  col-sm-10 col-md-6    col-xl-4  ">

                
                <form zippy="cform">
                  
                     <div class="row">
                         <label class="col-4 col-form-label" for="salesource">Джерело продаж</label>
                         <div class="col-8">
                            <select class="form-select" zippy="salesource">
                                <option value="0">Не обрано</option>
                            </select>
                        </div> 
                         <small> Виконує також роль назви магазану  </small>
                                   
                    </div>   
                                    
                                    
                    <div class="  row">
                        <label class="col-4 col-form-label" for="site">Адреса сайту</label>
                      <div class="col-8">
                        <input type="text" zippy="site" class="form-control" required="required"/>
                         <small><i class="fa fa-exclamation text-danger"></i> Потрібно  вводити повну адресу (з http або https)</small>
                     </div>
                    </div>
               
                    
                    <div class="row">
                        <label class="col-4 col-form-label" for="apiname">Назва API</label>
                      <div class="col-8">
                       <input type="text" zippy="apiname" class="form-control" required="required"/>
                    </div>
                    </div>
                    <div class="row">
                        <label class="col-4 col-form-label" for="key">Код API</label>
                      <div class="col-8">
                       <textarea style="height:150px;" zippy="key" class="form-control" required="required"></textarea>
                    </div>
                    </div>
               
                

                             
                    <div class="row">
                        <label class="col-4 col-form-label" for="defpricetype">Тип ціни </label>
                     <div class="col-8">

                        <select class="form-select" zippy="defpricetype">
                            <option value="0">Не обрано</option>

                        </select>
                        <small class="form-text text-muted">Ціна для оновлення в магазині </small>

                    </div>
                    </div>
                   <div class="row">
                        <label class="col-4 col-form-label" for="defpaytype">Спосіб оплати </label>
                      <div class="col-8">

                        <select class="form-select" zippy="defpaytype">
                            <option value="0">Не вказано</option>

                        </select>
                        

                    </div>
                    </div>
                   
                    <div class="row">
                        <label class="col-4 col-form-label" for="defmf">Каса </label>

                        <div class="col-8">
                     <select class="form-select" zippy="defmf">
                            <option value="0">Не вказана</option>

                        </select>
                        <small class="form-text text-muted">Обов'язкова  якщо тип оплати  - передплата </small>

                    </div>
                    </div>
                    <div class="row">
                        <label class="col-4 col-form-label" for="defstore">Склад</label>
                       <div class="col-8">

                        <select class="form-select" zippy="defstore">
                            <option value="0">Не вказаний</option>

                        </select>
                        
                    </div>
                    </div>
                    <div class="form-check">
                        <input zippy="v4" type="checkbox" class="form-check-input">
                        <label class="form-check-label" for="v4">Opencart v4 </label>

                    </div>
                    <div class="form-check">
                        <input zippy="reserve" type="checkbox" class="form-check-input">
                        <label class="form-check-label" for="reserve">Автоматично резервувати товари </label>
                         
                    </div>
              
                    <div class="form-check">
                        <input zippy="dostore" type="checkbox" class="form-check-input">
                        <label class="form-check-label" for="dostore">Списуватии товари в замовленнi </label>
                        <br><small class="form-text text-muted">Якщо не використовується ТТН, Чек  або ВН  </small>
  
                    </div>
                     <div class="form-check">
                        <input zippy="usettn" type="checkbox" class="form-check-input">
                        <label class="form-check-label" for="usettn">Формувати ТТН </label>
                        <br><small class="form-text text-muted">Якщо потрiьно тiльки списати  товари зi складу  </small>
  
                    </div>
              
                    <div class="form-check">
                        <input zippy="insertcust" type="checkbox" class="form-check-input">
                        <label class="form-check-label" for="insertcust">Імпортувати контрагентів </label>
                         
                    </div>
              
                            
                    <div class="mt-2">
                        <a zippy="cancel"   zippy="save" class="btn btn-secondary ">Скасувати</a>
                        <input type="submit" value="Зберегти" zippy="save" class="btn   btn-primary ms-4"/>
                            

                    </div>
                </form>
            </div>
        </div>
        <script>

            function check_rtest() {

                 document.getElementById('dialogwait').showModal()
            }
            function check_rdel() {
                return confirm("Видалити магазин?")
                
            }

        </script>

    </body>
</html>
