<html>

    <body>

        <div class="row  ">
            <div class="col-12  col-sm-10 col-md-6    col-xl-4  ">
                <h4>Налаштування з'єднання</h4>
                <form zippy="cform">
                    <div class="mb-2">
                        <label class="form-label" for="site">Адреса сайту</label>
                        <input type="text" zippy="site" class="form-control" required="required"/>
                    </div>
                    <div class="mb-2">
                        <label class="form-label" for="keyc">Ключ</label>
                        <input placeholder="ck_XXXXXXXXXXXXXXXXXXXX" zippy="keyc" class="form-control" required="required"/>
                    </div>
                    <div class="mb-2">
                        <label class="form-label" for="keys">Секретний ключ</label>
                        <input placeholder="cs_XXXXXXXXXXXXXXXXXXXX" zippy="keys" class="form-control" required="required"/>
                    </div>
                    <div class="mb-2">
                        <label class="form-label" for="api">Версія API </label>

                        <select class="form-select" zippy="api"> </select>

                    </div>
                     {{#hideblock}}
                    <div class="form-check">
                        <input class="form-label" zippy="ssl" type="checkbox" class="form-check-input">
                        <label class="form-check-label" for="ssl">Перевірка SSL сертифіката </label>

                    </div>
                     {{/hideblock}}
              
                 <div class="mb-2">
                        <label class="form-label" for="salesource">Джерело продаж</label>
                        <select class="form-select" zippy="salesource">
                            <option value="0">Не обрано</option>
                        </select>
                    </div>                    
                     
                    <div class="mb-2">
                        <label class="form-label" for="defpricetype">Тип ціни </label>

                        <select class="form-select" zippy="defpricetype">
                            <option value="0">Не обрано</option>

                        </select>

                    </div>
                     <div class="mb-2">
                        <label class="form-label" for="defpaytype">Спосіб оплати </label>

                        <select class="form-select" zippy="defpaytype">
                            <option value="0">Не вказано</option>

                        </select>
                        

                    </div>                    
                     <div class="mb-2">
                        <label class="form-label" for="defmf">Каса  </label>

                        <select class="form-select" zippy="defmf">
                            <option value="0">Не вказана</option>

                        </select>
                         <small class="form-text text-muted">Обов'язкова  якщо тип оплати  - передплата </small>
  
                    </div>
                      <div class="mb-2">
                        <label class="form-label" for="defstore">Склад</label>

                        <select class="form-select" zippy="defstore">
                            <option value="0">Не вказаний</option>

                        </select>
                       
                    </div>
                      <div class="form-check">
                        <input zippy="reserve" type="checkbox" class="form-check-input">
                        <label class="form-check-label" for="reserve">Автоматично резервувати товари </label>
                         
                    </div>
              
                    <div class="form-check">
                        <input zippy="insertcust" type="checkbox" class="form-check-input">
                        <label class="form-check-label" for="insertcust">Списуватии товари в замовленнi </label>
                        <small class="form-text text-muted">Якщо не використовується ТТН, Чек  або ВН  </small>
  
                    </div>
              
                    <div class="form-check">
                        <input zippy="insertcust" type="checkbox" class="form-check-input">
                        <label class="form-check-label" for="insertcust">Імпортувати контрагентів </label>
                       
                    </div>                                   
                    <div class="my-2">
                        <input type="submit" value="Зберегти" zippy="save" class="btn   btn-primary me-2"/>
                        
                        <div id="loader" style="display:none" class="spinner-border spinner-border-sm"></div>

                    </div>
                </form>
            </div>
        </div>
        <script>

            function check_check() {

                $('#loader').removeAttr('style');
            }

        </script>

    </body>
</html>
