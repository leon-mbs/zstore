<html>
 <head>
        <title>  Системний лог  </title>

    </head>

    <body>
 
        <div class="row">
             
            <div class="col-12 col-md-8 col-xl-6 col-xxl-4 "  >
                <h5>Системні повідомлення</h5>
                <div class="navbar">
                    <form  zippy="filter"  >
                      <div class="row  ">
                       <div class="col-auto  ">
                         <input   class="form-control me-2" type="text" zippy="searchtext" placeholder="Пошук по контенту">
                       </div>
                       <div class="col-auto  ">
                         <input   type="submit" class="  btn btn-success  " value="Шукати">
                      </div>
                     </div>
                    </form>



                </div>

                <table class="ctable    ">
                    <tr  zippy="nlist">

                        <td>   <i class="fa fa-clock"> </i> <span zippy="ndate" > </span>
                           
                            <small zippy="msg" >
                            </small>
                        </td>
                        <td><span  zippy="newn" class="badge text-bg info">Нове</span></td>


                    </tr>
                </table>
                <div zippy="pag"></div>              

      
            </div>

              
                <div class="col-12 col-md-4  col-xxl-3"  >
                <h5>Файловий лог</h5>
                <table class="table table-sm    ">
                    <tr  zippy="flist">

                        <td zippy="fname">                        </td>
                        <td> 
                        <a zippy="fview"   title="Переглянути"> <i class="fa fa-eye"></i></a>
                        &nbsp;&nbsp;<a zippy="fdown"   title="Завантажити"> <i class="fa fa-download"></i></a>
                         </td>


                    </tr>
                </table> 
                    
                 <pre style="font-size:smaller" zippy="fc"  >    
              
                </pre>
               
              </div>
              
    <div class="col-12   col-xl-11 col-xxl-10 "  >
             <h5>Загальна історія документів </h5>
                
            <form zippy="sfilter"   >
                      <div class="row row-cols-sm-auto g-2 align-items-start mb-2">
                       
                        
                            <div class="col-12">
                              <div class="input-group">
                             <label   for="from">З </label>
                             
                                <input type="text" class="form-control    " zippy="from" style="width:110px">
                             </div>
                             </div>
                        
                      
                                <div class="col-12">
                                <div class="input-group">
                               <label   for="to"> по </label>
                               
                                  <input type="text" class="form-control   " style="width:110px" zippy="to">
                              </div>
                              </div>
                          
                             <div class="col-12">
                            <div class="input-group">
                                <label   for="status"> Статус </label>
                            
                                <select class="form-select  " zippy="status">
                                    <option value="0">Не вказано</option>
                                </select>
                            </div>
                            </div>
                            <div class="col-12">
                            <div class="input-group">
                         
                                <label   for="doctype"> Тип </label>
                                          
                               <select class="form-select    " zippy="doctype">
                                    <option value="0">Не вказано</option>
                                </select>
                           </div>
                           </div>
                          
                          
                           <div class="col-12">
                            <div class="input-group">
                        
                               <label   for="author"> Автор </label>
                                                           
                               <select class="form-select    " zippy="author">
                                        <option value="0">Не обрано</option>
                                    </select>
                             </div>
                             </div>
                           
                          
                         
                          <div class="col-12">
                            
                            <input type="submit" class="   btn btn-success  " value="ОК">
                            
                         
                       </div>
                   </div>
     

                    </form>
                                  
        <table class="ctable  mt-2 ">
                    <tr  zippy="slist">

                        
                        <td class="text-nowrap  " zippy="dt"> </td>
                        <td class="text-nowrap  "><a zippy="number"></a></td>
                        <td   zippy="state"> </td>
                        <td   zippy="auser"> </td>
                        <td   zippy="comm"> </td>
                         

                    </tr>
                </table>
                <div zippy="spag" class="w-50"></div>              
        
            <a id="dankor" name="dankor"></a>
            <div zippy="docview"></div>
          </div>              
              
        </div>
 
<script>

   function check_delall() {
       return confirm("Очистити?")
   }

</script>    
          
    </body>

</html>
