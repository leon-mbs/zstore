<html>
    <head>
        <title>  Заявки постачальникам </title>

    </head>
   <body>
        <div class="row">
            <div class="col-12 col-xl-10">

                <h3>Заявки постачальникам </h3>


                <div class="navbar">
                    <form zippy="filter"  >
                       <div class="row  ">

                        <label class="col-form-label col-auto" for="searchnumber"> № </label>
                         <div class="col-auto  ">
                           <input class="form-control me-2" type="text" zippy="searchnumber" style="width:100px">
                        </div>
                         <div class="col-auto  ">
                          <select class="form-control me-2" zippy="status">
                          </select>
                        </div>
                        <div class="col-auto  ">
                          <input class="form-control me-2" type="text" zippy="searchtext" placeholder="Пошук по контенту" ]>
                        </div>
                         <div class="col-auto  ">
                          <input type="submit" class="  btn btn-success  " value="ОК">
                       </div>
                   </div>
                    </form>
                </div>
                <a href="/index.php?p=App/Pages/Doc/OrderCust" class="btn btn-primary mt-2 mb-3">Створити</a>
                <br><a zippy="csv">Експорт у Excel</a>

                <table class="table   table-sm   ">
                    <tr>

                        <th>Номер</th>
                        <th>Дата</th>
                        <th>Постачальник</th>
                        <th class="text-end">Сума</th>
                        <th>Статус</th>
                        <th>Доставка</th>


                        <th></th>
                        <th></th>


                    </tr>
                    <tr zippy="doclist">

                        <td  ><a zippy="number"></a></td>
                        <td class="text-nowrap" zippy="date"></td>
                        <td zippy="customer"></td>
                        <td zippy="amount" class="text-end"></td>


                        <td class="text-nowrap" zippy="state"></td>
                        <td class="text-nowrap" zippy="delivery"></td>
                        <td zippy="onotes">Коментар</td>

                        <td class="text-nowrap">
                            <a zippy="show" title="Перегляд"><i class="fa fa-eye"></i></a>
                            &nbsp; &nbsp; &nbsp; &nbsp; <a zippy="edit" title="Редагування"><i class="fa fa-edit"></i></a>

                        </td>


                    </tr>

                </table>

                <div zippy="pag">
                </div>
                <a id="dankor"></a>


            </div>

        </div>


        <div class="row" zippy="statuspan">
            <div class="col-12">

                <div class="card">
                    <form zippy="statusform">   
                       <div class="row  ">
                             <div class="  col-auto">
                            <button zippy="bcan" type="submit" class="  btn btn-secondary  me-2 "><i class="fa fa-undo"></i>
                                Скасувати
                            </button>      </div>
                             <div class="  col-auto">    
                             <button zippy="binp" class="btn btn-primary  me-2"><i class="fa fa-cog"></i> На виконання</button>
                               </div> 
                             <div class="  col-auto">                    
                            <button zippy="bclose" type="submit" class="  btn btn-success  me-2 "><i class="fa fa-gavel"></i>
                                Закрити
                            </button>   </div>
                            <div class="  col-auto">
                               <a onclick="openexp(1)" title="Створити прибуткову  накладну" zippy="bttn" class="btn btn-primary  me-2"><i class="fa fa-truck"></i> Створити ПН</a>
                             </div> 
                            <div class="  col-auto">
                               <a  onclick="openexp(2)" title="Створити рахунок вхiдний" zippy="binv" class="btn btn-primary  me-2"><i class="fa fa-credit-card"></i> Створити РВ </a>
                            
                           </div>
                          <div class="  col-auto">
                              <div class="  row">
                               
                                 <div class="col-auto mt-2"><label data-label="deldate"  for="deldate">Доставка</label></div>
                                 <div class="col-auto"> <input zippy="deldate" style="width:120px" class="form-control  me-2" ></div> <div class="col-auto"><button zippy="bdeldate" data-label="deldate" class="btn btn-success  me-2">Задати</button></div>
                              
                             </div>
                         </div>
                       </div>
                    </form>
                </div>


                <div zippy="docview"></div>

            </div>
        </div>
   
   
      <div id="modalexp" class="modal fade  " tabindex="-1"                   >
                <div class="modal-dialog  modal-dialog-scrollable modal-lg   ">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 id="titleexp" class="modal-title"> </h5>
                         
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                                
                            </button>
                        </div>
                        <div   class="modal-body">
                         <form zippy="formexp"  >
                          <input type="hidden" zippy="typeexp"> 
                           <table class="table table-sm">
                           <tr   >
                           <th>
                              <i onclick=" $('.seldel').prop('checked', $('.seldel').prop('checked') == false);"
                                        style="width:30px;cursor:pointer" title="Зняти/виставити прапорець"
                                            class="fa fa-check-double "></i>                   
                           </th>
                           <th colspan="4"></th>
                           </tr>
                           <tr  zippy="exptitemlist">
                              <td style="width:20px"><input zippy="checkscan" class="seldel mt-1" type="checkbox"></td>
                              <td zippy="editlistname"></td>
                              <td zippy="editlistcode"></td>
                              <td align="right"  > <input pattern="[0-9\.]+" style="width:75px;" zippy="editlistqty">  </td>
                              <td  align="right"  ><input pattern="[0-9\.]+" style="width:100px;" zippy="editlistprice"></td>
                           </tr> 
                            <tr   >
                        
                           <td align="right" colspan="5"></th>
                               <b id="total" ></b>
                           </td>
                           </tr>
                         </table>         
                         <div class="navbar d-flex  justify-content-end">
                            <button onclick="closeModal('modalexp')"   class="  btn btn-secondary  me-2 ">Скасувати</button>                 
                            <button zippy="expcreate" type="submit" class="  btn btn-success  ms-4 me-2 ">Створити</button>                 
                            <input type="checkbox"  zippy="expclose"> &nbsp; <label for="expclose">Закрити заявку</label>

                            
         
                         </div>


                       </form>
                        </div>
                     
                    </div>
                </div>
            </div>    
   
    <script>
       function openexp(dtype){
           
           if(dtype==1) {
               $("#titleexp").text("Створити ПН")
           }
           if(dtype==2) {
               $("#titleexp").text("Створити РВ")
           }
           
           $("#typeexp").val(dtype)  
           $("#expclose").prop('checked',false) 
         
           openModal('modalexp')
            
           
           setInterval(()=>
           {
               var cnt=0;
               var sum=0;
               $('.seldel').each(function(index, element) {
 
                  if( $(element).prop('checked') == true) {
                     cnt++; 
                     var row=  $(element).attr('rn')
                
                     var q=  parseVal(  $("[rn='q"+row+"']").val() )
                     var p=  parseVal(  $("[rn='p"+row+"']").val()  )
                     sum =  sum+(q*p)
                     $("#total").text(  "Вибрано "+cnt+ " строка на  суму "+ fa( sum))                       
                  }
                  
                 
                  
                });
                               
               
               
           }, 500);
           
           
       }
    </script>
    

    </body>
</html>
