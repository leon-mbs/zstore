<html>
    <head>
        <title> Журнал доставок  </title>

    </head>
   <body>
        <div class="row"  >

            <div class="col-12 col-md-4 col-xl-3   " >
                <h3>Журнал доставок</h3>
                <small>Журнал для  кур`єрів</small>
                <div id="newordersalert" style="display:none;"  class="alert alert-success  ms-4"  >
                    <span id="neworderscnt"></span>
                </div>   

            </div>
            <div class="w-100">

                <div class="col-12 col-md-10 col-xl-8" >
                            <div class="navbar">
                                <form zippy="searchform"  >
                                    <div class="row row-cols-sm-auto g-2 align-items-start ">
                                         <div class="col-12">
                                           <div class="input-group">
                                         

                                    <label   for="searchnumber"> № </label>
                                   
                                    <input class="form-control me-2" type="text" zippy="searchnumber" style="width:100px">
                                    </div>
                                    </div>
                                       <div class="col-12  ">
                                    <input type="submit" class="  btn btn-success  " value="Шукати">
                                 </div>
                                 </div>

                                </form>
                    </div>

   
                    <table class="table  table-sm">
                        <tr>
                         
                            <th>Номер</th>
                            <th>Дата</th>
                            <th >Статус</th>
                            <th >Час доставки</th>
                            <th >Адреса </th>
                            <th >Контакт </th>
                            <th >Відповідальний </th>
                            <th class="text-end">Сума</th>

                            <th ></th>
                            <th ></th>
                        </tr>
                        <tr zippy="orderlist">
                           

                            <td ><a zippy="docnumber"></a></td>
                             <td zippy="docdate"  >   </td>
                            <td zippy="state"> </td>

                            <td class="text-nowrap  " zippy="deltime">  </td>
                            <td  zippy="address">   </td>
                            <td  zippy="contact">   </td>
                            <td  zippy="emp_name">   </td>


                            <td class="text-end" zippy="docamount"></td>

                            <td   ><i title="Дл сплати"  zippy="wp" class="fa fa-credit-card" ></i></td>
                            <td zippy="docnotes"></td>
                        </tr>

                    </table> 
                    <a id="dankor"></a>
                </div>
                <div class="col-12 col-md-10 xl-8" >
                    <div   zippy="statuspan">

                       
                         
                                <div class="navbar justify-content-start">
                                    <form zippy="timeform" class="  me-4"  >
                                       <div class="input-group  ">
                                           <label    >Час доставки</label>
                                           <input required="on"  class="form-control"   zippy="dt"  >
                                           <input required="on"  zippy="time" class="form-control">
                                           <button zippy="btime"  type="submit" class="  btn btn-primary ms-2   ">  Змінити</button>
                                      
                                       </div>
                                    </form>  
                                             
                                   <form zippy="statusform" class="  me-4"  >
                                       <div class="input-group  ">
                                          
                                        <button zippy="bdelivered" type="submit" class="  btn btn-success  me-2 ">Доставлено</button>   
                                         
                                        <label   data-label="emp" for="emp">Відповідальний</label>
                                           
                                        <select zippy="emp" class="form-select me-2">
                                            <option value="0">Не вказано</option>
                                        </select>    
                                           
                                        <button zippy="bsend" type="submit" class="  btn btn-success ms-2  me-2 ">Відправити </button>   
                                       
                                       </div>
                                    </form>

                                    <form zippy="payform" class="  me-4" >
                                    <div class="input-group   ">
                                        <label   data-label="payamount" for="payamount">До сплати</label>
                                           
                                       <input   style="width:75px;" pattern="[0-9,\.]+" zippy="payamount" class="form-control qtyprice me-2">
                                         
                                        <label   data-label="mf" for="mf">Рахунок</label>
                                          
                                        <select zippy="mf" class="form-select">
                                            <option value="0">Не вказано</option>
                                        </select>    
                                        
                                        <button zippy="bpay" type="submit" class="  btn btn-primary ms-2  me-2 ">Внести оплату</button>
                                       </div>  
                                    </form>
                                </div>
                           
                        </div>




                        <div class="p-box">
                           
                                <div zippy="docview"></div>

                            
                        </div>
                    </div>

                </div>


            </div>
        </div>
        <script>
                window.setInterval(onNewOrder, 5000);

              
                function onNewOrder() {
                        callPM('getMessages',null,null,(data)=> 
                        {
                           
                               var  answer = JSON.parse(data)  
                              
                                if (answer.cnt > 0) {
                                    $('#newordersalert').show();
                                    $('#neworderscnt').text('Нових доставок ' + answer.cnt);

                                }       
                            
                        } )     
                    
                    
                    
                }

            </script>              
                     
    </body>
</html>
